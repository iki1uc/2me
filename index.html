<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · Axiom‑Orbit‑System · v2</title>

<style>
    body { background:#0b0b0b; color:#e0e0e0; font-family:Consolas; padding:20px; }
    h1 { color:#6cf; }

    .flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:6px 0; }

    .btn { padding:6px 14px; background:#222; color:#fff; border:1px solid #555; cursor:pointer; font-family:Consolas; }
    .btn:hover { border-color:#6cf; }
    .btn.active { border-color:#6cf; background:#2a3a4a; }
    .btn.danger { border-color:#f44; color:#f44; }
    .btn.danger:hover { background:#2a0a0a; }
    .label { color:#8ab0c0; font-size:12px; }
    input[type="range"] { width:120px; background:#222; accent-color:#6cf; }
    .status { font-size:12px; color:#5a7a8a; }
    .status .ok { color:#8cf0d0; }
    .status .err { color:#ff6b6b; }
    .badge { display:inline-block; padding:1px 10px; border-radius:12px; font-size:11px; border:1px solid #2a3a4a; }
    .badge.aktiv { border-color:#8cf0d0; color:#8cf0d0; }
    .badge.pause { border-color:#f0d080; color:#f0d080; }
</style>
</head>

<body>

<div class="container">

  <span class="status">📡 Sync: <span id="syncStatus" class="ok">● verbunden</span></span>
</div>

<canvas id="orbitCanvas" width="700" height="300"></canvas>

<div class="flex">

  <span>📐 A81: <span id="axiomA81" style="color:#b388ff;">0</span></span>
</div>

<div id="log">System geladen · Orbit v2</div>

</div>

  'user.json','use.json'
];

  try { loaded.push(file); }
  catch (_) { failed.push(file); }
});

  modStatus.textContent = '● ' + loaded.length + ' Module geladen';
  modStatus.className = 'ok';
